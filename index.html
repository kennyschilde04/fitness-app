<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gym Tracker</title>
    <script>
      // Theme vor dem ersten Paint setzen. useTheme() vergibt die Klasse erst
      // in einem Effect — ohne das hier zeigt jeder Reload kurz das Default-
      // Theme, bevor das gespeicherte greift.
      (function () {
        try {
          var themes = ['dark', 'purple', 'light', 'midnight', 'ember', 'mint', 'mono'];
          var stored = localStorage.getItem('gym-tracker-theme');
          var theme = themes.indexOf(stored) === -1 ? 'dark' : stored;
          document.documentElement.classList.add(theme);
          if (theme === 'light' || theme === 'mint') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
